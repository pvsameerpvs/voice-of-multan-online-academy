<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#CFFAFE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8FBFF"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134A7C"/>
      <stop offset="1" stop-color="#0D355A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#06B6D4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="840" height="500" rx="0" fill="url(#bg)"/>
  <circle cx="130" cy="90" r="150" fill="url(#glow)"/>
  <circle cx="710" cy="420" r="160" fill="url(#glow)"/>
  <circle cx="80" cy="410" r="12" fill="#22D3EE" opacity="0.5"/>
  <circle cx="760" cy="110" r="9" fill="#06B6D4" opacity="0.45"/>
  <circle cx="700" cy="210" r="6" fill="#22D3EE" opacity="0.55"/>

  <g filter="url(#shadow)">
    <rect x="200" y="90" width="440" height="320" rx="36" fill="url(#card)" stroke="#A5F3FC" stroke-width="2"/>
    <g>
      <rect x="280" y="140" width="280" height="200" rx="22" fill="url(#night)"/>
      <rect x="300" y="160" width="240" height="140" rx="14" fill="#0B2A47"/>
      <text x="420" y="245" text-anchor="middle" font-family="Consolas, monospace" font-size="44" font-weight="bold" fill="#22D3EE">&lt;/&gt;</text>
      <rect x="300" y="312" width="240" height="12" rx="6" fill="#0B2A47"/>
      <rect x="300" y="160" width="240" height="12" rx="6" fill="#0B2A47"/>
      <circle cx="330" cy="242" r="8" fill="#F4B400" opacity="0.9"/>
      <circle cx="348" cy="242" r="8" fill="#F472B6" opacity="0.9"/>
      <circle cx="366" cy="242" r="8" fill="#22D3EE" opacity="0.9"/>
    </g>
    <circle cx="560" cy="150" r="5" fill="#06B6D4" opacity="0.4"/>
    <circle cx="290" cy="280" r="6" fill="#22D3EE" opacity="0.4"/>
  </g>
</svg>