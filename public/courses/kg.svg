<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBEB"/>
      <stop offset="1" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFAE8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#F59E0B" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="840" height="500" rx="0" fill="url(#bg)"/>
  <circle cx="120" cy="90" r="140" fill="url(#glow)"/>
  <circle cx="720" cy="400" r="170" fill="url(#glow)"/>
  <circle cx="90" cy="400" r="12" fill="#FBBF24" opacity="0.5"/>
  <circle cx="760" cy="110" r="9" fill="#F59E0B" opacity="0.45"/>
  <circle cx="690" cy="210" r="6" fill="#FBBF24" opacity="0.6"/>

  <g filter="url(#shadow)">
    <rect x="200" y="90" width="440" height="320" rx="36" fill="url(#card)" stroke="#FDE68A" stroke-width="2"/>
    <g>
      <rect x="262" y="120" width="148" height="140" rx="24" fill="url(#amber)"/>
      <rect x="430" y="120" width="148" height="140" rx="24" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/>
      <rect x="262" y="280" width="148" height="98" rx="24" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/>
      <rect x="430" y="280" width="148" height="98" rx="24" fill="url(#amber)"/>
      <text x="336" y="195" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="58" font-weight="bold" fill="#FFFFFF">A</text>
      <text x="504" y="195" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="58" font-weight="bold" fill="#F59E0B">B</text>
      <text x="336" y="342" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="38" font-weight="bold" fill="#F59E0B">1 + 2</text>
      <circle cx="520" cy="322" r="24" fill="#F4B400"/>
      <path d="M520 302 l5.5 12 13 2-9.5 9 2.5 13-11.5-6-11.5 6 2.5-13-9.5-9 13-2 z" fill="#FFFFFF"/>
    </g>
    <circle cx="240" cy="360" r="6" fill="#FBBF24" opacity="0.5"/>
    <circle cx="600" cy="170" r="5" fill="#F59E0B" opacity="0.4"/>
